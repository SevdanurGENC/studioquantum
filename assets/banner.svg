<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1b1145"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7ac6"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="80" cy="50" r="1.2"/><circle cx="210" cy="300" r="1"/><circle cx="420" cy="40" r="1.4"/>
    <circle cx="560" cy="320" r="1"/><circle cx="700" cy="70" r="1.2"/><circle cx="1150" cy="40" r="1"/>
    <circle cx="1100" cy="320" r="1.3"/><circle cx="640" cy="200" r="0.9"/><circle cx="30" cy="250" r="1"/>
  </g>

  <!-- Bloch sphere -->
  <g transform="translate(960,180)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="115" fill="none" stroke="#9fb3ff" stroke-width="2"/>
    <ellipse rx="115" ry="34" fill="none" stroke="#9fb3ff" stroke-width="1.5" stroke-dasharray="5 5"/>
    <ellipse rx="34" ry="115" fill="none" stroke="#9fb3ff" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-135" x2="0" y2="135" stroke="#9fb3ff" stroke-width="1" opacity="0.6"/>
    <text x="8" y="-122" fill="#dfe6ff" font-family="monospace" font-size="18">|0⟩</text>
    <text x="8" y="136" fill="#dfe6ff" font-family="monospace" font-size="18">|1⟩</text>
    <line x1="0" y1="0" x2="62" y2="-80" stroke="#ff7ac6" stroke-width="3.5" marker-end="url(#arrow)"/>
    <circle r="4" fill="#ff7ac6"/>
    <text x="70" y="-86" fill="#ff7ac6" font-family="monospace" font-size="18">|ψ⟩</text>
  </g>

  <!-- Text -->
  <text x="70" y="150" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">Studio Quantum</text>
  <text x="72" y="200" fill="#c9b8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28">Bitten kübite, deneyerek öğren.</text>
  <text x="72" y="236" fill="#8e9bd6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">From bit to qubit — learn by experimenting.</text>
  <g font-family="monospace" font-size="18" fill="#dfe6ff">
    <rect x="72" y="268" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7c5cff"/>
    <text x="96" y="291">26 proje</text>
    <rect x="236" y="268" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7c5cff"/>
    <text x="258" y="291">simülatörler</text>
    <rect x="420" y="268" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7c5cff"/>
    <text x="440" y="291">Python·Arduino</text>
  </g>
</svg>
